name: EVA MB-002 Security Gates
on:
  pull_request:
    paths:
      - 'src/lib/auth.js'
      - 'src/lib/metaSignature.js'
      - 'src/server.js'
      - 'src/routes/**'
      - 'src/followupWorker.js'
      - 'tests/eva-mb-002-*.test.js'
      - '.github/workflows/eva-mb-002-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run isolated security contract tests
        run: node --test tests/eva-mb-002-*.test.js
      - name: Check syntax without connecting to services
        run: |
          node --check src/server.js
          node --check src/lib/auth.js
          node --check src/lib/metaSignature.js
          node --check src/routes/messages.js
          node --check src/routes/whatsappWebhook.js
          node --check src/followupWorker.js
